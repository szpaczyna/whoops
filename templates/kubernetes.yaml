# Mirrors the Helm chart in https://github.com/szpaczyna/rpi-k3s/tree/main/cluster/helm/whoops
apiVersion: v1
kind: Secret
metadata:
  name: whoops-env
  namespace: whoops
type: Opaque
stringData:
  CLIENT_ID: "<your-whoop-client-id-here>"
  CLIENT_SECRET: "<your-whoop-client-secret-here>"
  REDIRECT_URI: "https://<host>/callback"
  SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://<user>:<password>@<whoop-postgres-service>.<namespace>.svc.cluster.local:5432/whoop_data"
  SECRET_KEY: "<a-long-random-string>"
  # Days fetched by the scheduled daily import (default 7).
  # FLASK_INCREMENTAL_IMPORT_DAYS: "7"
---
apiVersion: v1
kind: Service
metadata:
  name: whoops
  namespace: whoops
spec:
  type: ClusterIP
  selector:
    app: whoops
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoops
  namespace: whoops
spec:
  replicas: 1
  # WHOOP rotates refresh tokens, so two pods running at once can invalidate each other's token.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whoops
  template:
    metadata:
      labels:
        app: whoops
    spec:
      containers:
        - name: whoops
          image: docker.io/szpaczyn/whoops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: whoops-env
          resources:
            limits:
              cpu: 250m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 96Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoops
  namespace: whoops
spec:
  parentRefs:
    - name: <gateway-name>
      namespace: <gateway-namespace>
      kind: Gateway
      sectionName: <https-listener>
  hostnames:
    - "<host>"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoops
          port: 5000
