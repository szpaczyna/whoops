name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  create-release-pr:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please - Create PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: create-release-pr
    if: needs.create-release-pr.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release-pr.outputs.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: ver
        run: echo "VERSION=${{ needs.create-release-pr.outputs.tag_name }}" | sed 's/^v//' >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/whoops:${{ steps.ver.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/whoops:latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.VERSION }}

      - name: Update GitHub release with image link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release-pr.outputs.tag_name }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/whoops:${{ steps.ver.outputs.VERSION }}"
          gh release edit "$TAG" --append-notes "## Docker image: ${IMAGE}" || true